<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Alvas Library{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Alvas Institute of Engineering and Technology - Library</h1>
        <nav>
            <a href="/">Home</a> |
            {% if user.is_authenticated %}
                Welcome, {{ user.username }}! |
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a> |
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
            {% if user.is_staff %}
                | <a href="{% url 'issue_book' %}">Issue Book</a>
                | <a href="{% url 'return_book' %}">Return Book</a>
                | <a href="/admin/">Admin</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
