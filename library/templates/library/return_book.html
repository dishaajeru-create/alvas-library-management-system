{% extends 'library/base.html' %}
{% block title %}Return Book{% endblock %}
{% block content %}
<h2>Return a Book</h2>
<form method="post">
    {% csrf_token %}
    <label>Select Active Issue:</label>
    <select name="issue_id" required>
        {% for issue in active_issues %}
        <option value="{{ issue.id }}">{{ issue.book.title }} - {{ issue.member.member_id }} (Due: {{ issue.due_date|date:"d M Y" }})</option>
        {% endfor %}
    </select>
    <br><br>
    <button type="submit">Return Book</button>
</form>
{% endblock %}
